name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with GO_IMAGE in the Makefile.
  GO_VERSION: "1.27.4"
  CGO_ENABLED: "0"
  GOOS: linux
  GOARCH: amd64

jobs:
  check:
    name: gofmt, vet, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          files=$(gofmt -l cmd internal migrations web)
          if [ -n "$files" ]; then
            echo "gofmt needed:"
            echo "$files"
            exit 1
          fi

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go build
        run: go build -trimpath -ldflags="-s -w" -o bin/mesquita-panel ./cmd/panel

      - uses: actions/upload-artifact@v4
        with:
          name: mesquita-panel-linux-amd64
          path: bin/mesquita-panel
          if-no-files-found: error
          retention-days: 7
